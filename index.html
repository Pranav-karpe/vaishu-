<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Vaishu ❤️‍🩹</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- Romantic Bollywood Audio Tune -->
<audio id="bg-music" src="./romantic-tune.mp3" loop preload="auto"></audio>

<!-- Music Control Pill -->
<button id="music-btn" class="music-btn" aria-label="Toggle Music" title="Play / Pause Romantic Bollywood Tune">
  <span id="music-icon" class="music-icon">🎵</span>
  <span id="music-text" class="music-text">Play Music</span>
</button>

<!-- Ambient Heart Glow Backdrop -->
<div class="heart-glow-backdrop" id="heart-glow"></div>

<!-- Falling Love & Evil Eye Emojis Container -->
<div id="emoji-rain"></div>

<!-- Golden Message (appears after heart transition completes) -->
<div class="golden-message-container" id="golden-message">
  <h1 class="golden-title">Thank you so much Vaishu</h1>
  <p class="golden-subtitle">it means a lot to me <span class="healing-emoji">❤️‍🩹</span></p>
</div>

<!-- SVG reference path for heart coordinates -->
<svg viewBox="0 0 600 552">
  <path d="M300,107.77C284.68,55.67,239.76,0,162.31,0,64.83,0,0,82.08,0,171.71c0,.48,0,.95,0,1.43-.52,19.5,0,217.94,299.87,379.69v0l0,0,.05,0,0,0,0,0v0C600,391.08,600.48,192.64,600,173.14c0-.48,0-.95,0-1.43C600,82.08,535.17,0,437.69,0,360.24,0,315.32,55.67,300,107.77" fill="#ee5282"/>
</svg>

<script src="https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.136.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="./script.js"></script>

</body>
</html>
